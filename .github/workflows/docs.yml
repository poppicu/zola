name: Publish poppicu website

on:
  push:
    branches: [poppicu-website]
    paths:
      - 'website/**'
      - '.gitmodules'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/poppicu-website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Zola
        run: sh website/scripts/install-zola.sh "$RUNNER_TEMP/zola"
      - name: Build website
        run: '"$RUNNER_TEMP/zola/zola" --root website build'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
